# Network I/O — per-interface cumulative received/transmitted bytes from
# /proc/net/dev, shaped into a simple 3-column table by the widget's command.
id = "network-io"
label = "네트워크 I/O"
icon = "🌐"
description = "인터페이스별 누적 수신·송신 바이트예요."
command = "awk -F '[: ]+' 'BEGIN {printf \"%-16s %20s %20s\\n\", \"IFACE\", \"RX_BYTES\", \"TX_BYTES\"} NR>2 {printf \"%-16s %20s %20s\\n\", $2, $3, $11}' /proc/net/dev"
parser = "columns"
render = "table"
highlight_column = "RX_BYTES"
simple_view = "network"
category = "monitoring"
# No refresh_interval_seconds: uses the app's global default interval.
