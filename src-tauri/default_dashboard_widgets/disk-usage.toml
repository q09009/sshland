# df -h — disk usage as a table, filesystems shaded by how full they are.
# Reuses the exact convention of the command-GUI df-h config.
id = "disk-usage"
label = "디스크 사용량"
icon = "💾"
description = "파일시스템별 사용량을 표로 보여줘요."
command = "LC_ALL=C df -hP"
parser = "columns"
render = "table"
highlight_column = "Use%"
simple_view = "disk"
category = "monitoring"
refresh_interval_seconds = 30
