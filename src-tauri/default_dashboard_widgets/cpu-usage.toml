# Cumulative CPU time counters from /proc/stat. The client compares two
# snapshots, so the SSH worker never has to sleep while measuring an interval.
id = "cpu-usage"
label = "CPU 사용률"
icon = "🖥️"
description = "전체 CPU 사용률을 게이지로 표시해요."
command = "awk '/^cpu / {printf \"USER NICE SYSTEM IDLE IOWAIT IRQ SOFTIRQ STEAL\\n%.0f %.0f %.0f %.0f %.0f %.0f %.0f %.0f\\n\", $2, $3, $4, $5, $6, $7, $8, $9; exit}' /proc/stat"
parser = "columns"
render = "table"
highlight_column = "SYSTEM"
simple_view = "cpu"
category = "monitoring"
# No refresh_interval_seconds: uses the app's global default interval.
