[package]
name = "sshland"
version = "0.1.0"
description = "Beginner-friendly SSH/SFTP client"
authors = ["SSHland"]
edition = "2021"

# The library holds all app logic so it can also be reused by mobile targets.
[lib]
name = "sshland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses the declarative command-GUI config files (default + user TOML).
toml = "0.8"
# Blocking SSH/SFTP client. On Windows/MSVC this builds against the WinCNG
# crypto backend, so no OpenSSL/Perl toolchain is required.
ssh2 = "0.9"
# Async channels used to hand work to the blocking SSH worker thread.
tokio = { version = "1", features = ["sync"] }
# Native file-picker dialog (choosing a private key, and download targets).
tauri-plugin-dialog = "2"
# Text encoding for the editor: decode non-UTF-8 files (e.g. CP949/EUC-KR)
# for editing and re-encode them to the same encoding on save. chardetng
# guesses the encoding (the Firefox detector); encoding_rs does the transcode.
encoding_rs = "0.8"
chardetng = "0.1"

[target.'cfg(windows)'.dependencies]
# Access the existing WebView2 settings used by Tauri so browser-only
# accelerators do not steal terminal shortcuts such as Ctrl+Shift+C.
webview2-com = "0.38"
windows-core = "0.61"
