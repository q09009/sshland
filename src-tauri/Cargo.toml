[package]
name = "sshland"
version = "0.1.0"
description = "Beginner-friendly SSH/SFTP client"
authors = ["SSHland"]
edition = "2021"

# The library holds all app logic so it can also be reused by mobile targets.
[lib]
name = "sshland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
