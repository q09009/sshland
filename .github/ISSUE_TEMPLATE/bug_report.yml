name: 버그 제보
description: 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해주셔서 감사합니다. 보안 취약점은 이 양식을 사용하지 말고 SECURITY.md의 비공개 제보 절차를 따라주세요.
        서버 주소, 사용자명, IP, 비밀번호, 개인키와 토큰은 설명·로그·스크린샷에서 제거해주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 무엇이 잘못 동작했는지 간단히 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 순서대로 적어주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상한 동작
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: sshland 버전 또는 커밋
      placeholder: 예) 0.1.0 또는 Git 커밋 해시
    validations:
      required: true

  - type: input
    id: client-os
    attributes:
      label: 클라이언트 운영체제
      placeholder: 예) Windows 11 24H2, Fedora 43
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: 원격 서버 환경
      description: 민감한 호스트 정보는 제외해주세요.
      placeholder: 예) Ubuntu Server 24.04, OpenSSH 9.x

  - type: textarea
    id: evidence
    attributes:
      label: 로그 또는 스크린샷
      description: 민감 정보를 제거한 자료만 첨부해주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에서 같은 문제를 찾지 못했습니다.
          required: true
        - label: 첨부 자료에서 자격 증명과 서버 식별 정보를 제거했습니다.
          required: true
