name: 기능 제안
description: sshland를 더 편리하게 만들 아이디어를 제안해주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 기능 자체보다 먼저 어떤 상황에서 무엇이 불편한지 알려주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 사용자가 보게 될 흐름을 중심으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 현재 가능한 우회 방법이나 다른 설계가 있다면 적어주세요.

  - type: checkboxes
    id: scope
    attributes:
      label: 프로젝트 방향 확인
      options:
        - label: 가볍고 초보자 친화적인 SSH/SFTP 작업 공간이라는 프로젝트 범위를 확인했습니다.
          required: true
